<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Error {{ code }} · {{ profile.pharmacy_name or app_name }}</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef1f2; color: #1b2327;
         font: 14px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  .box { background: #fff; border: 1px solid #d5dcdf; padding: 28px 34px; min-width: 320px; text-align: center; }
  .brand { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: #1f6f4a; }
  h1 { margin: 10px 0 4px; font-size: 40px; color: #1f2a30; }
  a { display: inline-block; margin-top: 14px; padding: 7px 14px; background: #1f6f4a; color: #fff; text-decoration: none; }
</style>
</head>
<body>
<div class="box">
  <div class="brand">{{ (profile.pharmacy_name or app_name) | upper }}</div>
  <h1>{{ code }}</h1>
  <p>{{ message }}</p>
  <a href="/app">Back to the workspace</a>
</div>
</body>
</html>
