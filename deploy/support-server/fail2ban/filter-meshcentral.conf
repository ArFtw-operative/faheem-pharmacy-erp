# MeshCentral auth log (settings.authLog): "Oct 4 06:07:17 meshcentral https[1234]: Failed password for X from 1.2.3.4 port 5555"
[Definition]
failregex = ^\s*\w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{1,2}\s+meshcentral\s+https\[\d+\]:\s+Failed (?:password|2FA) for .+ from <HOST> port \d+
ignoreregex =
datepattern = ^%%b %%d %%H:%%M:%%S
